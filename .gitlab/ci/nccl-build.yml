# Runner templates and the NCCL source-build body; the parent pipeline publishes
# the NCCL artifacts to the children.
# build-nccl.sh caches finished output in this project's generic package registry
# (package NCCL_CACHE_PACKAGE, one version per NCCL commit, arch and toolchain
# fingerprint); NCCL_CACHE=0 builds without restoring or publishing.

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  GIT_DEPTH: "20"
  # Extension jobs consume the NCCL build artifact rather than cloning their
  # own potentially different revision of the moving NCCL master branch.
  GIT_SUBMODULE_STRATEGY: none
  FF_USE_FASTZIP: "true"
  FF_ENABLE_JOB_CLEANUP: "true"
  FF_TIMESTAMPS: "true"
  # Active x86 downstream tests run on EOS (H100). ARM jobs override with sm_100.
  NVCC_GENCODE: "-gencode=arch=compute_90,code=sm_90"
  # NCCL's versioned build environment; nccl-extensions tracks NCCL's dev
  # environment deliberately.
  NCCL_CI_IMAGE: gitlab-master.nvidia.com:5005/nccl/nccl/ci
  NCCL_CI_IMAGE_VERSION: "1.0.0"
  NCCL_CI_CUDA12_VERSION: "12.9"
  NCCL_CI_CUDA13_VERSION: "13.4"
  NCCL_CI_IMAGE_SUFFIX: "-dev"

# One runner template per (arch, CUDA major): image pin, runner tag, node
# selector and pod size. A job combines one of these with its build body.
.ipp6-x86-cu12-build:
  image: "${NCCL_CI_IMAGE}:${NCCL_CI_IMAGE_VERSION}-cu${NCCL_CI_CUDA12_VERSION}${NCCL_CI_IMAGE_SUFFIX}"
  tags:
    - ipp6-k8s-x86
  variables:
    KUBE_NODE_SELECTOR: kubernetes.io/arch=amd64
    KUBERNETES_CPU_REQUEST: 32
    KUBERNETES_CPU_LIMIT: 32
    KUBERNETES_MEMORY_REQUEST: 64Gi
    KUBERNETES_MEMORY_LIMIT: 128Gi

.ipp6-x86-cu13-build:
  image: "${NCCL_CI_IMAGE}:${NCCL_CI_IMAGE_VERSION}-cu${NCCL_CI_CUDA13_VERSION}${NCCL_CI_IMAGE_SUFFIX}"
  tags:
    - ipp6-k8s-x86
  variables:
    KUBE_NODE_SELECTOR: kubernetes.io/arch=amd64
    KUBERNETES_CPU_REQUEST: 32
    KUBERNETES_CPU_LIMIT: 32
    KUBERNETES_MEMORY_REQUEST: 64Gi
    KUBERNETES_MEMORY_LIMIT: 128Gi

.ipp6-arm-cu13-build:
  image: "${NCCL_CI_IMAGE}:${NCCL_CI_IMAGE_VERSION}-cu${NCCL_CI_CUDA13_VERSION}${NCCL_CI_IMAGE_SUFFIX}"
  tags:
    - ipp6-k8s-arm
  variables:
    KUBE_NODE_SELECTOR: kubernetes.io/arch=arm64
    KUBERNETES_CPU_REQUEST: 96
    KUBERNETES_CPU_LIMIT: 96
    KUBERNETES_MEMORY_REQUEST: 450Gi
    KUBERNETES_MEMORY_LIMIT: 450Gi

# Build body only: build:nccl adds the ARCH x CUDA matrix, the timeout and NCCL_ARTIFACT_DIR.
.build-nccl:
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: "1"
    GIT_SUBMODULE_PATHS: third_party/nccl
    NCCL_CACHE: "1"
    NCCL_CACHE_PACKAGE: nccl-ci-build-cache
  script:
    - |
      set -euxo pipefail
      NCCL_COMMIT="$(git -C third_party/nccl rev-parse HEAD)"
      echo "Building public NCCL at ${NCCL_COMMIT}"
      bash .gitlab/ci/build-nccl.sh
      mkdir -p "${NCCL_ARTIFACT_DIR}"
      cp -a .ci/nccl-build-cache/build "${NCCL_ARTIFACT_DIR}/"
      printf '%s\n' "${NCCL_COMMIT}" > "${NCCL_ARTIFACT_DIR}/NCCL_COMMIT"
  artifacts:
    name: "${CI_JOB_NAME_SLUG}-${CI_COMMIT_SHORT_SHA}"
    expire_in: 24 hours
    paths:
      - "${NCCL_ARTIFACT_DIR}/"
