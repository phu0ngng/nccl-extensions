# Shared NCCL source-build template used independently by each child pipeline.

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  GIT_DEPTH: "20"
  # Extension jobs consume the NCCL build artifact rather than cloning their
  # own potentially different revision of the moving NCCL master branch.
  GIT_SUBMODULE_STRATEGY: none
  FF_USE_FASTZIP: "true"
  FF_ENABLE_JOB_CLEANUP: "true"
  FF_TIMESTAMPS: "true"
  NVCC_GENCODE: "-gencode=arch=compute_90,code=sm_90 -gencode=arch=compute_100,code=sm_100 -gencode=arch=compute_100a,code=sm_100a"

.ipp6-build:
  image: gitlab-master.nvidia.com:5005/nccl/nccl-images/ci:2.32-c12.9.0
  tags:
    - ipp6-k8s
  variables:
    KUBE_NODE_SELECTOR: kubernetes.io/arch=amd64
    KUBERNETES_CPU_REQUEST: 14
    KUBERNETES_CPU_LIMIT: 32
    KUBERNETES_MEMORY_REQUEST: 64Gi
    KUBERNETES_MEMORY_LIMIT: 128Gi

.build-nccl:
  extends: .ipp6-build
  timeout: 1h
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: "1"
  script:
    - |
      set -euxo pipefail
      NCCL_COMMIT="$(git -C third_party/nccl rev-parse HEAD)"
      echo "Building public NCCL at ${NCCL_COMMIT}"
      test -f third_party/googletest/googletest/src/gtest-all.cc
      make -C third_party/nccl -j"$(nproc)" NVCC_GENCODE="${NVCC_GENCODE}" src.build
      mkdir -p .ci
      cp -a third_party/nccl .ci/nccl
      cp -a third_party/googletest .ci/googletest
      printf '%s\n' "${NCCL_COMMIT}" > .ci/nccl/NCCL_COMMIT
  artifacts:
    name: "nccl-${CI_COMMIT_SHORT_SHA}"
    expire_in: 24 hours
    paths:
      - .ci/nccl/
      - .ci/googletest/
