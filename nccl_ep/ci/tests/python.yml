      -c 'exec "${PYTHON_BIN}" "${CI_PROJECT_DIR}/nccl_ep/ep_test.py" "$@"' _
      -t ${tokens} -d ${hidden} -a ll -L em -s dispatch

  - name: ep_python_ll_em_staged_combine
    binary: "@bash"
