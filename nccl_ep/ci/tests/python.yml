# Complete ep_test.py sanity matrix.
defaults:
  timeout: 300
  owners: lschneider
  min_gpus: 4
  np: NGPUS
  labels: [nccl_ep, integration, python]

test_type: ep_test

env:
  NCCL_EP_JIT_SOURCE_DIR: "${NCCL_HOME}/include/nccl_ep"
  NCCL_EP_JIT_BUILD_INCLUDE_DIR: "${NCCL_HOME}/include"
  NCCL_EP_JIT_CUDA_INCLUDE_DIR: "${CUDA_HOME}/include"
  NCCL_EP_JIT_NVCC: "${CUDA_HOME}/bin/nvcc"
  LD_LIBRARY_PATH: "${CUDA_HOME}/lib:${CUDA_HOME}/extras/CUPTI/lib64:${LD_LIBRARY_PATH}"

constants:
  tokens: "16"
  hidden: "1024"

tests:
  - name: ep_python_ll_em
    binary: "@bash"
    args: >-
      -c 'exec "${PYTHON_BIN}" "${CI_PROJECT_DIR}/nccl_ep/ep_test.py" "$@"' _
      -t ${tokens} -d ${hidden} -a ll -L em

  - name: ep_python_ll_rm
    binary: "@bash"
    args: >-
      -c 'exec "${PYTHON_BIN}" "${CI_PROJECT_DIR}/nccl_ep/ep_test.py" "$@"' _
      -t ${tokens} -d ${hidden} -a ll -L rm

  - name: ep_python_ht_fl
    binary: "@bash"
    args: >-
      -c 'exec "${PYTHON_BIN}" "${CI_PROJECT_DIR}/nccl_ep/ep_test.py" "$@"' _
      -t ${tokens} -d ${hidden} -a ht -L fl

  - name: ep_python_ht_em
    binary: "@bash"
    args: >-
      -c 'exec "${PYTHON_BIN}" "${CI_PROJECT_DIR}/nccl_ep/ep_test.py" "$@"' _
      -t ${tokens} -d ${hidden} -a ht -L em

  - name: ep_python_ll_quant
    binary: "@bash"
    args: >-
      -c 'exec "${PYTHON_BIN}" "${CI_PROJECT_DIR}/nccl_ep/ep_test.py" "$@"' _
      -t ${tokens} -d ${hidden} -a ll -Q

  - name: ep_python_ht_quant
    binary: "@bash"
    args: >-
      -c 'exec "${PYTHON_BIN}" "${CI_PROJECT_DIR}/nccl_ep/ep_test.py" "$@"' _
      -t ${tokens} -d ${hidden} -a ht -Q

  - name: ep_python_ll_em_staged_dispatch
    binary: "@bash"
