      - name_suffix: count_unfused
        env:
          NCCL_EP_HT_COUNT_UNFUSED: "1"
      - name_suffix: pull_push
        args_append: "--gtest_filter=HtOverflowDropTest.DispatchCombineContinueOnOverflow:HtOverflowDropTest.FlatFusedDropRecount:HtOverflowDropTest.EmLocalPermuteAlignedDropNoOob:HtOverflowDropTest.EmLocalPermuteDeepFlatOverflowPhantomRowsZeroed"
