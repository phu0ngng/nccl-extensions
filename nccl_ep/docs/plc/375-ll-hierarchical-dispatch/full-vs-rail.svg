<rect x="30" y="653" width="540" height="96" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="300" y="679" class="domain" text-anchor="middle">RAIL: one fixed remote peer</text>
<text x="300" y="705" class="note" text-anchor="middle">GPU 1 must send to GPU 9, even when GPU 9 needs no token.</text>
<text x="300" y="730" class="note" text-anchor="middle">Every required GPU receives a local forwarded copy.</text>
<rect x="630" y="653" width="540" height="96" rx="12" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="900" y="679" class="domain" text-anchor="middle">FULL: eight eligible remote peers</text>
<text x="900" y="705" class="note" text-anchor="middle">GPU 1 chooses GPU 8, which already needs the token.</text>
<text x="900" y="730" class="note" text-anchor="middle">The same connections also permit Direct delivery.</text>
<text x="600" y="778" class="note" text-anchor="middle" style="fill:#526176">Both panels use hierarchical delivery. Current implementation uses FULL; RAIL is deferred.</text>
