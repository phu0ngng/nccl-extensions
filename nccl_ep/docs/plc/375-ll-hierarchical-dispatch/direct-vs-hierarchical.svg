<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Direct versus hierarchical dispatch</title>
<desc id="desc">Each panel shows two LSA domains with eight GPUs each. GPU 0 sends a token needed by GPUs 8, 10, 13 and 15. Direct delivery sends four network copies. Hierarchical delivery sends one network copy to GPU 8, which forwards locally to GPUs 10, 13 and 15.</desc>
<defs>
<marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#2563eb"/></marker>
<marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#15803d"/></marker>
</defs>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.heading{font-size:23px;font-weight:700}.sub{font-size:14px;fill:#526176}.domain{font-size:15px;font-weight:650}.gpu{font-size:15px;font-weight:650}.note{font-size:13px}.network{fill:none;stroke:#2563eb;stroke-width:3;marker-end:url(#blue)}.local{fill:none;stroke:#15803d;stroke-width:3;marker-end:url(#green)}</style>
<rect width="1200" height="650" rx="18" fill="#fff"/>
<path d="M600 25V600" stroke="#e2e8f0"/>

