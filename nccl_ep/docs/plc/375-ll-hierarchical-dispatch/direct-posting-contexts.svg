<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">Direct posting: CTA, warp, context and remote-peer ownership</title>
<desc id="desc">Two active send CTAs, eight remote GPUs. Peer-parallel mode with sixteen contexts maps CTA zero warps zero to seven to contexts zero to seven and GPUs eight to fifteen. CTA one uses contexts eight to fifteen for those same GPUs. Sequential-peer mode with eight contexts uses only warp zero in each CTA; context zero or one visits GPUs eight through fifteen sequentially. Below two contexts, those CTAs must share through NCCL GPU arbitration.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.heading{font-size:20px;font-weight:650}.body{font-size:15px}.small{font-size:13px;fill:#526176}.chip{font-size:13px}.blue{fill:#2563eb}.green{fill:#15803d}</style>
<rect width="1200" height="900" rx="18" fill="white"/>
<path d="M600 65V695" stroke="#e2e8f0"/>

<text x="600" y="35" text-anchor="middle" class="title">Direct posting · context budget determines who posts to each peer</text>
<text x="300" y="85" text-anchor="middle" class="heading blue">Peer-parallel</text>
<text x="900" y="85" text-anchor="middle" class="heading green">Sequential peers</text>
<text x="300" y="111" text-anchor="middle" class="small">A = 2 send CTAs · R = 8 remote GPUs · C = 16 contexts</text>
<text x="900" y="111" text-anchor="middle" class="small">A = 2 send CTAs · R = 8 remote GPUs · C = 8 contexts</text>
<text x="300" y="138" text-anchor="middle" class="body">A × R ≤ C → one context per CTA/peer pair</text>
<text x="900" y="138" text-anchor="middle" class="body">A ≤ C &lt; A × R → one exclusive context per CTA</text>
