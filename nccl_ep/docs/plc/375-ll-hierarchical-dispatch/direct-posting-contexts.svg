<text x="600" y="725" text-anchor="middle" class="body">Both modes: warp routing vote → lane-0 GIN puts → completion to every remote peer.</text>
<rect x="60" y="750" width="1080" height="65" rx="9" fill="#fffbeb" stroke="#fcd34d"/>
<text x="600" y="778" text-anchor="middle" class="body">If C &lt; A: context = sendCta % C, with NCCL GPU-sharing arbitration for safe concurrent reuse.</text>
<text x="600" y="803" text-anchor="middle" class="small">Example: A = 2, C = 1 → both CTAs use context 0; they cannot treat it as an exclusive THREAD-owned context.</text>
<text x="600" y="849" text-anchor="middle" class="small">Peer-parallel mapping: context = sendCta × R + remotePeerOrdinal; the ordinal excludes local LSA members.</text>
<text x="600" y="877" text-anchor="middle" class="small">Example source domain: GPUs 0–7. Remote peers: GPUs 8–15. C denotes resolved GIN contexts, not requested QPs.</text>
</svg>
