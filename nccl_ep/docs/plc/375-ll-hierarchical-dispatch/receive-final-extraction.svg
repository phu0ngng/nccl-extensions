<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="365" viewBox="0 0 1200 365" role="img" aria-labelledby="title desc">
<title id="title">Extract live final slots into rank-major output</title><desc id="desc">Acquire each producer completion first, then ballot full ready tags. For each live slot, reserve an output row within the source region, rebuild source and expert metadata, and copy the payload into recv_x. Fixed singleton copying uses a CTA; Round Robin uses a warp.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.heading{font-size:18px;font-weight:650}.body{font-size:15px}.small{font-size:13px;fill:#526176}</style>
<rect width="1200" height="365" rx="18" fill="white"/>
<text x="600" y="35" text-anchor="middle" class="title">Final extraction · internal slots become output rows only after completion</text>
<text x="600" y="65" text-anchor="middle" class="small">Direct, remote-relayed, and source-local arrivals all feed this same extraction step.</text>
<rect x="30" y="105" width="255" height="110" rx="10" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="157.5" y="134" text-anchor="middle" class="heading">Acquire completion</text>
<text x="157.5" y="163" text-anchor="middle" class="small">hierWaitDoneCount / probe task</text>
<text x="157.5" y="187" text-anchor="middle" class="small">Direct: also check full VA counter</text>
<rect x="325" y="105" width="255" height="110" rx="10" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="452.5" y="134" text-anchor="middle" class="heading">Find live slots</text>
<text x="452.5" y="163" text-anchor="middle" class="small">hierCopyFinalTokens</text>
<text x="452.5" y="187" text-anchor="middle" class="small">32 lanes probe → ready-tag ballot</text>
<rect x="620" y="105" width="255" height="110" rx="10" fill="#ede9fe" stroke="#cbd5e1"/>
<text x="747.5" y="134" text-anchor="middle" class="heading">Reserve a compact row</text>
<text x="747.5" y="163" text-anchor="middle" class="small">Lane 0: atomicAdd per-source count</text>
<text x="747.5" y="187" text-anchor="middle" class="small">Broadcast row within source region</text>
<rect x="915" y="105" width="255" height="110" rx="10" fill="#f0fdf4" stroke="#cbd5e1"/>
<text x="1042.5" y="134" text-anchor="middle" class="heading">Produce recv_x + metadata</text>
<text x="1042.5" y="163" text-anchor="middle" class="small">recordRankMajorRecvTokenMetadata</text>
<text x="1042.5" y="187" text-anchor="middle" class="small">Warp copies payload with int4 loop</text>
<path d="M285 160 H319" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M580 160 H614" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M875 160 H909" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1042 215 V255 H452 V221" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="750" y="278" text-anchor="middle" class="small">Repeat for each set bit, then the producer’s remaining token-slot batches.</text>
<text x="600" y="316" text-anchor="middle" class="body">One token: hierCopyFinalSingleton · Fixed uses a CTA; Round Robin uses a warp. Zero tokens: no payload copy.</text>
<text x="600" y="346" text-anchor="middle" class="small">Dense completion can provide capacity as a scan bound; full 64-bit ready tags select the live rows.</text>
</svg>
