<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="405" viewBox="0 0 1200 405" role="img" aria-labelledby="title desc">
<title id="title">Retire receive readers, clean sparse counts, and advance the epoch</title><desc id="desc">Each CTA joins all readers and has warp zero lane zero report one arrival. The last CTA, not necessarily CTA zero, elects its warp zero to clear source-count done words. Each writer fences, the warp joins, and its leader resets arrivals and advances the epoch. No terminal grid barrier is used.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.heading{font-size:18px;font-weight:650}.body{font-size:15px}.small{font-size:13px;fill:#526176}</style>
<rect width="1200" height="405" rx="18" fill="white"/>
<text x="600" y="35" text-anchor="middle" class="title">Kernel retirement · last-arrival election replaces a terminal grid barrier</text>
<rect x="30" y="105" width="255" height="110" rx="10" fill="#eff6ff" stroke="#cbd5e1"/>
<text x="157.5" y="134" text-anchor="middle" class="heading">Every CTA joins readers</text>
<text x="157.5" y="163" text-anchor="middle" class="small">coop.sync()</text>
<text x="157.5" y="187" text-anchor="middle" class="small">Warp 0 leader: atomicAdd(arrivals, 1)</text>
<rect x="325" y="105" width="255" height="110" rx="10" fill="#ede9fe" stroke="#cbd5e1"/>
<text x="452.5" y="134" text-anchor="middle" class="heading">Last CTA elects warp 0</text>
<text x="452.5" y="163" text-anchor="middle" class="small">Last result is broadcast to that warp</text>
<text x="452.5" y="187" text-anchor="middle" class="small">Earlier CTAs need no terminal wait</text>
<rect x="620" y="105" width="255" height="110" rx="10" fill="#fef3c7" stroke="#cbd5e1"/>
<text x="747.5" y="134" text-anchor="middle" class="heading">Clear source-count words</text>
<text x="747.5" y="163" text-anchor="middle" class="small">Each lane handles source ranks</text>
<text x="747.5" y="187" text-anchor="middle" class="small">One send-CTA-zero word per source</text>
<rect x="915" y="105" width="255" height="110" rx="10" fill="#f0fdf4" stroke="#cbd5e1"/>
<text x="1042.5" y="134" text-anchor="middle" class="heading">Order cleanup, advance e</text>
<text x="1042.5" y="163" text-anchor="middle" class="small">Each writer: release fence; warp joins</text>
<text x="1042.5" y="187" text-anchor="middle" class="small">Leader resets arrivals and updates e</text>
<path d="M285 160 H319" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M580 160 H614" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M875 160 H909" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="60" y="255" width="1080" height="85" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="600.0" y="284" text-anchor="middle" class="heading">EP16 cleanup: 16 × 8-byte words = 128 bytes</text>
<text x="600.0" y="313" text-anchor="middle" class="small">The elected warp’s lanes 0–15 clear done[bank][source][0]; other done slots and payload tags are retained.</text>
<text x="600.0" y="337" text-anchor="middle" class="small">Cumulative Direct VA counters and sender-owned history are never reset by this cleanup.</text>
<text x="600" y="374" text-anchor="middle" class="body">Only the elected leader calls completeFullLowLatencyEpoch after the hierarchical wrapper establishes ordering.</text>
<text x="600" y="398" text-anchor="middle" class="small">Kernel completion and matched stream ordering protect later reuse; the shared epoch also advances across ordinary LL operations.</text>
</svg>
