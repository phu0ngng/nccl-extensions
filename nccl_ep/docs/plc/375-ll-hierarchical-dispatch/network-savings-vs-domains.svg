   <text style="fill: #172033; font: 700 16px 'DejaVu Sans'; text-anchor: middle" x="421.935156" y="25.1175" transform="rotate(-0 421.935156 25.1175)">Exact routing model: how much network payload can be removed?</text>
  </g>
  <g id="text_16">
   <text style="fill: #526176; font: 8.3px 'DejaVu Sans'; text-anchor: start" x="59.055156" y="337.932" transform="rotate(-0 59.055156 337.932)">Exact uniform sampling of distinct experts without replacement; 16 experts/GPU, so total experts = 16 × D × M.</text>
  </g>
  <g id="text_17">
   <text style="fill: #526176; font: 8.3px 'DejaVu Sans'; text-anchor: start" x="59.055156" y="350.0496" transform="rotate(-0 59.055156 350.0496)">Probabilities evaluated by ll_dispatch_policy.h (SHA-256 08423deafeb3); derived quantities are expectations, not measurements.</text>
  </g>
  <g id="text_18">
   <text style="fill: #526176; font: 8.3px 'DejaVu Sans'; text-anchor: start" x="59.055156" y="362.1672" transform="rotate(-0 59.055156 362.1672)">Payload reduction = 1 − H/G; excludes headers, completions and extra local copies. It is not dispatch speedup.</text>
  </g>
