<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Common RDMA staging inside hierStageAndPost</title>
<desc id="desc">Eight-warp CTA timeline. Warp 0 initially finishes local count reset. Warps 1 to 7 clear the padded header, then all warps join. Warp 1 calls hierMakeHeader and copies its payload vectors; warps 2 to 7 copy payload vectors concurrently. After a second CTA join, warp 0 calls hierSetDeliveryHeader. Repeat for all assigned tokens, then a final CTA join hands the staged packets to hierSendDirect or hierSendRelay.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.title{font-size:24px;font-weight:700}.heading{font-size:17px;font-weight:650}.body{font-size:15px}.small{font-size:13px;fill:#526176}.tiny{font-size:12px;fill:#526176}</style>
<rect width="1200" height="660" rx="18" fill="white"/>

<text x="600" y="35" text-anchor="middle" class="title">hierStageAndPost · prepare the packets before posting</text>
<text x="600" y="63" text-anchor="middle" class="small">One active RDMA send CTA · eight warps · packet destination is the registered outgoing bank</text>
<text x="310" y="108" text-anchor="middle" class="heading">Clear padded header</text>
<text x="690" y="108" text-anchor="middle" class="heading">Build header + copy payload</text>
<text x="1020" y="108" text-anchor="middle" class="heading">Stamp delivery extension</text>
<text x="58" y="205" text-anchor="start" class="heading">Warp 0</text>
<path d="M170 205 H1140" stroke="#e2e8f0" stroke-width="2"/>
<text x="58" y="295" text-anchor="start" class="heading">Warp 1</text>
<path d="M170 295 H1140" stroke="#e2e8f0" stroke-width="2"/>
<text x="58" y="385" text-anchor="start" class="heading">Warps 2–7</text>
<path d="M170 385 H1140" stroke="#e2e8f0" stroke-width="2"/>
<rect x="185" y="170" width="250" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="310.0" y="197" text-anchor="middle" class="body">Local count reset, then wait</text>
<text x="310.0" y="220" text-anchor="middle" class="tiny">Count reset happens only at kernel entry</text>
<rect x="185" y="260" width="250" height="70" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
<text x="310.0" y="287" text-anchor="middle" class="body">Clear header region</text>
<text x="310.0" y="310" text-anchor="middle" class="tiny">Inline stores</text>
<rect x="185" y="350" width="250" height="70" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
<text x="310.0" y="377" text-anchor="middle" class="body">Clear header region</text>
<text x="310.0" y="400" text-anchor="middle" class="tiny">Inline stores</text>
<rect x="505" y="170" width="330" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="670.0" y="210.0" text-anchor="middle" class="body">Wait for packet construction</text>
<rect x="505" y="260" width="175" height="70" rx="8" fill="#ede9fe" stroke="#c4b5fd"/>
<text x="592.5" y="287" text-anchor="middle" class="body">hierMakeHeader</text>
<text x="592.5" y="310" text-anchor="middle" class="tiny">Token ID · top-k IDs/weights</text>
<rect x="690" y="260" width="145" height="70" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
<text x="762.5" y="287" text-anchor="middle" class="body">Copy payload</text>
<text x="762.5" y="310" text-anchor="middle" class="tiny">int4 load/store loop</text>
<rect x="505" y="350" width="330" height="70" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
<text x="670.0" y="377" text-anchor="middle" class="body">Copy payload</text>
<text x="670.0" y="400" text-anchor="middle" class="tiny">Warps 2–7 start while warp 1 builds the header</text>
<rect x="905" y="170" width="235" height="70" rx="8" fill="#dcfce7" stroke="#86efac"/>
<text x="1022.5" y="197" text-anchor="middle" class="body">hierSetDeliveryHeader</text>
<text x="1022.5" y="220" text-anchor="middle" class="tiny">Warp vote → leader stamps words</text>
<rect x="905" y="260" width="235" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="1022.5" y="300.0" text-anchor="middle" class="body">Packet copy complete</text>
<rect x="905" y="350" width="235" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="1022.5" y="390.0" text-anchor="middle" class="body">Packet copy complete</text>
<rect x="459" y="145" width="16" height="292" rx="5" fill="#fef3c7" stroke="#fbbf24"/>
<text x="467" y="459" text-anchor="middle" class="small">CTA join A</text>
<text x="467" y="480" text-anchor="middle" class="small">coop.sync()</text>
<rect x="859" y="145" width="16" height="292" rx="5" fill="#fef3c7" stroke="#fbbf24"/>
<text x="867" y="459" text-anchor="middle" class="small">CTA join B</text>
<text x="867" y="480" text-anchor="middle" class="small">coop.sync()</text>
<path d="M1020 437 V507 H210 V437" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="600" y="529" text-anchor="middle" class="small">Repeat for token i, i + S, i + 2S, … until this producer’s packets are staged.</text>
<rect x="60" y="550" width="1080" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
<text x="600.0" y="577" text-anchor="middle" class="body">Final CTA join → posting handoff</text>
<text x="600.0" y="600" text-anchor="middle" class="tiny">Direct: coop.sync() before hierSendDirect · Hierarchical: entry coop.sync() inside hierSendRelay</text>
<text x="600" y="646" text-anchor="middle" class="small">Ordering is schematic, not timed. CTA joins protect this packet; the later grid-wide prefix join serves a different boundary.</text>
</svg>
