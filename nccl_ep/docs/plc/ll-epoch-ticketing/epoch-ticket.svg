<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img"><rect width="960" height="470" fill="#f8fafc"/><style>text{font-family:Arial;fill:#1f2937}.t{font-size:25px;font-weight:bold}.l{font-size:16px;font-weight:bold}.s{font-size:14px}.b{stroke:#334155;stroke-width:2}.a{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#2563eb"/></marker></defs><text x="40" y="42" class="t">One packed atomic synchronizes CTA arrivals and epochs</text><text x="60" y="94" class="l">epoch_arrivals (32-bit device word)</text><rect x="60" y="115" width="550" height="70" fill="#bfdbfe" class="b"/><rect x="610" y="115" width="290" height="70" fill="#bbf7d0" class="b"/><text x="225" y="157" class="l">epoch: 22 bits</text><text x="675" y="157" class="l">arrivals: 10 bits</text><text x="60" y="220" class="s">CTA thread 0: old = atomicAdd(epoch_arrivals, 1)</text><path d="M360 228V270" class="a"/><rect x="80" y="282" width="250" height="75" rx="8" fill="#dbeafe" class="b"/><text x="104" y="315" class="s">epoch = old &gt;&gt; 10</text><text x="104" y="340" class="s">bank = epoch &amp; 1</text><rect x="390" y="282" width="250" height="75" rx="8" fill="#dcfce7" class="b"/><text x="414" y="315" class="s">arrival = old &amp; 1023</text><text x="414" y="340" class="s">last: arrival == CTAs - 1</text><path d="M640 320H720" class="a"/><rect x="725" y="282" width="180" height="75" rx="8" fill="#fef3c7" class="b"/><text x="742" y="315" class="s">last CTA adds</text><text x="742" y="340" class="s">1024 - CTAs</text><text x="60" y="405" class="s">Before: epoch × 1024. After N arrivals and adjustment: (epoch + 1) × 1024.</text><text x="60" y="432" class="s">All N ≤ 1024 CTAs observe identical epoch bits; no grid-wide publication barrier.</text></svg>