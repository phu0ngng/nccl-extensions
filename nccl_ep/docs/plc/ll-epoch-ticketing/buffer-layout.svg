<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img"><rect width="960" height="500" fill="#f8fafc"/><style>text{font-family:Arial;fill:#1f2937}.t{font-size:25px;font-weight:bold}.l{font-size:16px;font-weight:bold}.s{font-size:14px}.b{stroke:#334155;stroke-width:2}.a{stroke:#2563eb;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3z" fill="#2563eb"/></marker></defs><text x="40" y="40" class="t">Group-owned GPU epoch selects the shared LL double buffer</text><rect x="285" y="68" width="390" height="90" rx="12" fill="#fef3c7" class="b"/><text x="316" y="101" class="l">LL group device state (one per group)</text><text x="330" y="128" class="s">ll_epoch  →  bank = ll_epoch &amp; 1</text><text x="336" y="148" class="s">pending epoch + in-flight flag pair staged SEND / RECV</text><path d="M420 160V205H245V245" class="a"/><path d="M540 160V205H715V245" class="a"/><text x="218" y="224" class="s">even epoch: bank 0</text><text x="648" y="224" class="s">odd epoch: bank 1</text><rect x="45" y="250" width="390" height="182" rx="14" fill="#dbeafe" class="b"/><text x="68" y="282" class="l">Shared group RDMA buffer — Bank 0</text><rect x="70" y="302" width="340" height="34" rx="6" fill="#93c5fd" class="b"/><text x="88" y="324" class="s">dispatch + combine payload</text><rect x="70" y="347" width="340" height="34" rx="6" fill="#bfdbfe" class="b"/><text x="88" y="369" class="s">receive counts / finish flags</text><rect x="70" y="392" width="340" height="24" rx="6" fill="#e0f2fe" class="b"/><text x="88" y="410" class="s">GIN signals [0, N)</text><rect x="525" y="250" width="390" height="182" rx="14" fill="#dcfce7" class="b"/><text x="548" y="282" class="l">Shared group RDMA buffer — Bank 1</text><rect x="550" y="302" width="340" height="34" rx="6" fill="#86efac" class="b"/><text x="568" y="324" class="s">dispatch + combine payload</text><rect x="550" y="347" width="340" height="34" rx="6" fill="#bbf7d0" class="b"/><text x="568" y="369" class="s">receive counts / finish flags</text><rect x="550" y="392" width="340" height="24" rx="6" fill="#dcfce7" class="b"/><text x="568" y="410" class="s">GIN signals [N, 2N)</text><text x="70" y="472" class="s">All handles on the group share these device words; no handle owns a private parity.</text></svg>
