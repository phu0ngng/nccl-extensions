# Standalone port of NCCL's contrib/nccl_ep child pipeline.
# Reference: NCCL commit 540cf9684e99a7b3444dade0a54e827c68a3adc0.

stages:
  - build
  - setup
  - unit_test
  - integration_test
  - cleanup

include:
  - local: .gitlab/ci/nccl-build.yml
  - local: .gitlab/cluster-paths.yml
  - local: nccl_ep/ci/cft-ci.yml

variables:
  FF_USE_FASTZIP: "true"
  FF_ENABLE_JOB_CLEANUP: "true"
  FF_TIMESTAMPS: "true"
  GIT_DEPTH: "1"
  CI_JOB_SUBPATH: "${CI_PIPELINE_ID}/${CI_JOB_ID}"

  # Parent artifacts are read-only inputs. Mutable installs belong to this
  # child pipeline; individual jobs add their ID before writing so retries
  # cannot overwrite another attempt's files.
  EOS_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/gitlab-runner/install/${CI_PIPELINE_ID}/eos"
  PRE_NYX_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/gitlab-runner/install/${CI_PIPELINE_ID}/pre-nyx"
  PRE_TYCHE_INSTALL_DIR: "/lustre/fsw/coreai_libraries_nccl/gitlab-runner/install/${CI_PIPELINE_ID}/pre-tyche"
  IPP6_INSTALL_DIR: "/storage/gitlab-runner/nccl/install/${CI_PIPELINE_ID}"

  EOS_NVSUBMIT_LOG_DIR: "/lustre/fsw/coreai_libraries_nccl/gitlab-runner/logs/nccl_ep/${CI_PIPELINE_ID}/${CI_JOB_ID}"
  PRE_NYX_NVSUBMIT_LOG_DIR: "/lustre/fsw/coreai_libraries_nccl/gitlab-runner/logs/nccl_ep/${CI_PIPELINE_ID}/${CI_JOB_ID}"
  PRE_TYCHE_NVSUBMIT_LOG_DIR: "/lustre/fsw/coreai_libraries_nccl/gitlab-runner/logs/nccl_ep/${CI_PIPELINE_ID}/${CI_JOB_ID}"
  IPP6_NVSUBMIT_LOG_DIR: "/storage/gitlab-runner/logs/nccl_ep/${CI_PIPELINE_ID}/${CI_JOB_ID}"

  IPP6_SLURM_PARTITION: "a100-cicd"
  IPP6_CUDA_HOME: "/storage/toolkits/cuda-12.9"
  MPI_HOME: "/usr/local/openmpi"

  EOS_CUDA_HOME: "/lustre/fsw/coreai_libraries_nccl/toolkits/cuda-12.8.0"
  EOS_MPI_HOME: "/usr/mpi/gcc/openmpi-4.1.5rc2"
  PRE_NYX_CUDA_HOME: "/lustre/fsw/coreai_libraries_nccl/toolkits/cuda-12.8.0"
  PRE_NYX_MPI_HOME: "/lustre/fsw/coreai_libraries_nccl/toolkits/openmpi-5.0.6"
  PRE_TYCHE_CUDA_HOME: "/lustre/fsw/coreai_libraries_nccl/toolkits/cuda-13.0"
  PRE_TYCHE_MPI_HOME: "/lustre/fsw/coreai_libraries_nccl/toolkits/openmpi-5.0.6"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "parent_pipeline"'
    - when: never


##
## Stage: build
##

.build_ep:
  extends: .ipp6-build
  stage: build
  timeout: 2h
  needs:
    - pipeline: "${PARENT_PIPELINE_ID}"
      job: build:nccl-x86-cu13
      artifacts: true
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
    GIT_SUBMODULE_DEPTH: "1"
    GIT_SUBMODULE_PATHS: third_party/googletest
    NCCL_HOME: "${CI_PROJECT_DIR}/build"
    NCCL_BASE_ARTIFACT_DIR: "${CI_PROJECT_DIR}/.ci/nccl-x86-cu13/build"
    MPI_HOME: "/usr/local"
    # UBI8 needs this library for std::filesystem in shared and static EP links.
    NVCC_APPEND_FLAGS: "-lstdc++fs"
    LIBRARY_PATH: "/usr/local/cuda/lib64/stubs"
  script:
    - |
      set -euxo pipefail
      rm -rf "${NCCL_HOME}"
      mkdir -p "${NCCL_HOME}"
      cp -a "${NCCL_BASE_ARTIFACT_DIR}/." "${NCCL_HOME}/"

      EP_BUILD=(make -C "${CI_PROJECT_DIR}/nccl_ep" -j"${KUBERNETES_CPU_REQUEST}"
        MPI=1 MPI_HOME="${MPI_HOME}" BUILDDIR="${NCCL_HOME}"
        NVCC_GENCODE="${NVCC_GENCODE}")
      # Finish shared-library symlinks before parallel executable links start.
      "${EP_BUILD[@]}" lib
      "${EP_BUILD[@]}" ep_test ep_bench af_test

      env NCCL_HOME="${NCCL_HOME}" \
        make -C "${CI_PROJECT_DIR}/nccl_ep/tests" -j"${KUBERNETES_CPU_REQUEST}" \
          BUILDDIR="${NCCL_HOME}" \
          GTEST_DIR="${CI_PROJECT_DIR}/third_party/googletest/googletest" \
          NVCC_GENCODE="${NVCC_GENCODE}"

      ART="${NCCL_EP_ARTIFACT_STAGING:-nccl_ep_install_artifact}"
      rm -rf "${ART}"
      mkdir -p "${ART}/lib" "${ART}/include" "${ART}/test/nccl_ep"
      cp -a "${NCCL_HOME}/lib"/libnccl_ep.* "${ART}/lib/"
      cp -a "${NCCL_HOME}/include/nccl_ep.h" "${ART}/include/"
      cp -a "${NCCL_HOME}/include/nccl_ep" "${ART}/include/"
      cp -a "${NCCL_HOME}/test/nccl_ep/ep_test" "${NCCL_HOME}/test/nccl_ep/ep_bench" "${NCCL_HOME}/test/nccl_ep/af_test" "${ART}/test/nccl_ep/"
      for unit_test in "${NCCL_HOME}/test/nccl_ep"/test_*; do
        if [[ -f "${unit_test}" && -x "${unit_test}" ]]; then
          cp -a "${unit_test}" "${ART}/test/nccl_ep/"
        fi
      done
  artifacts:
    paths:
      - nccl_ep_install_artifact/
    expire_in: 48 hours

build:x86-cu13:
  extends: .build_ep
  # EOS consumes x86-cu12; no active job consumes this variant yet.
  rules:
    - when: never

build:x86-cu12:
  extends:
    - .build_ep
    - .ipp6-x86-cu12-build
  # The internal NCCL CI image uses UBI8/GCC 8 and requires the legacy
  # libstdc++fs archive for std::filesystem. When Python loads that EP library
  # alongside EOS's newer libstdc++, incompatible filesystem symbols can mix,
  # causing crashes in std::filesystem::path destruction during JIT setup.
  # Build EP with Ubuntu 22.04 instead: its standard libstdc++ provides
  # std::filesystem without that archive. Keep this override scoped to EP;
  # the NCCL dependency still comes from the internal image's build artifact.
  image: nvidia/cuda:12.9.2-devel-ubuntu22.04
  needs:
    - pipeline: "${PARENT_PIPELINE_ID}"
      job: build:nccl-x86-cu12
      artifacts: true
  variables:
    NCCL_BASE_ARTIFACT_DIR: "${CI_PROJECT_DIR}/.ci/nccl-x86-cu12/build"
    MPI_HOME: "/usr/lib/x86_64-linux-gnu/openmpi"
    NVCC_APPEND_FLAGS: ""
  before_script:
    - apt-get update
    - >
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends
      build-essential
      libopenmpi-dev
      openmpi-bin

build:arm-cu13:
  extends:
    - .build_ep
    - .ipp6-arm-build
  needs:
    - pipeline: "${PARENT_PIPELINE_ID}"
      job: build:nccl-arm-cu13
      artifacts: true
  variables:
    NCCL_BASE_ARTIFACT_DIR: "${CI_PROJECT_DIR}/.ci/nccl-arm-cu13/build"
    NVCC_GENCODE: "-gencode=arch=compute_100,code=sm_100"


##
## Stage: setup
##

.setup_base:
  stage: setup
  needs:
    - pipeline: "${PARENT_PIPELINE_ID}"
      job: build:nccl-x86-cu12
      artifacts: true
    - job: build:x86-cu12
      artifacts: true
  variables:
    GIT_STRATEGY: clone
    NCCL_BASE_ARTIFACT_DIR: "${CI_PROJECT_DIR}/.ci/nccl-x86-cu12/build"
  script:
    - |
      set -euxo pipefail
      ART="${NCCL_EP_ARTIFACT_DIR:-${CI_PROJECT_DIR}/nccl_ep_install_artifact}"
      DST="${NCCL_EP_MERGE_TARGET:-${EOS_INSTALL_DIR}/${CI_JOB_ID}/build}"
      INSTALL_ROOT="$(dirname "${DST}")"
      BASE_ARTIFACT_DIR="${NCCL_EP_BASE_ARTIFACT_DIR:-${NCCL_BASE_ARTIFACT_DIR:-}}"
      mkdir -p "${DST}/lib" "${DST}/include" "${DST}/test/nccl_ep"
      if [[ -n "${BASE_ARTIFACT_DIR}" ]]; then
        cp -a "${BASE_ARTIFACT_DIR}/." "${DST}/"
      fi
      if [[ -n "${NCCL_CLUSTER_CONFIG_SOURCE:-}" ]]; then
        cp -a "${NCCL_CLUSTER_CONFIG_SOURCE}" "${NCCL_CLUSTER_CONFIG_TARGET}"
      fi
      cp -a "${ART}/lib"/libnccl_ep.* "${DST}/lib/"
      cp -a "${ART}/include/nccl_ep.h" "${DST}/include/"
      cp -a "${ART}/include/nccl_ep" "${DST}/include/"
      cp -a "${ART}/test/nccl_ep/ep_test" "${ART}/test/nccl_ep/ep_bench" "${ART}/test/nccl_ep/af_test" "${DST}/test/nccl_ep/"
      for unit_test in "${ART}/test/nccl_ep"/test_*; do
        if [[ -f "${unit_test}" && -x "${unit_test}" ]]; then
          cp -a "${unit_test}" "${DST}/test/nccl_ep/"
        fi
      done
      NVSUBMIT_VENV="${INSTALL_ROOT}/nvsubmit-venv"
      python3 -m venv "${NVSUBMIT_VENV}"
      "${NVSUBMIT_VENV}/bin/pip" install nvsubmit==0.3.5 \
        --index-url https://gitlab-master.nvidia.com/api/v4/projects/231609/packages/pypi/simple
      # Downstream jobs consume the setup producer's path through dotenv.
      printf 'NCCL_HOME=%s\nNCCL_EP_HOME=%s\nNCCL_EP_BUILDDIR=%s\nNCCL_EP_INSTALL_ROOT=%s\nNVSUBMIT_VENV=%s\n' \
        "${DST}" "${DST}" "${DST}" "${INSTALL_ROOT}" "${NVSUBMIT_VENV}" > nccl_ep_install.env
  artifacts:
    reports:
      dotenv: nccl_ep_install.env
    expire_in: 48 hours

setup:eos:
  extends: .setup_base
  tags:
    - nccl-eos
  variables:
    CI_BUILDS_DIR: "${EOS_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"

setup:ipp6:
  extends: .setup_base
  rules:
    - when: never
  tags:
    - ipp6-nccl
  variables:
    NCCL_EP_MERGE_TARGET: "${IPP6_INSTALL_DIR}/${CI_JOB_ID}/build"

setup:pre-nyx:
  extends: .setup_base
  rules:
    - when: never
  tags:
    - prenyx
  variables:
    NCCL_EP_MERGE_TARGET: "${PRE_NYX_INSTALL_DIR}/${CI_JOB_ID}/build"
    CI_BUILDS_DIR: "${PRE_NYX_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NCCL_CLUSTER_CONFIG_SOURCE: "${CI_PROJECT_DIR}/.gitlab/ci/clusters/pre-nyx-config.sh"
    NCCL_CLUSTER_CONFIG_TARGET: "${PRE_NYX_INSTALL_DIR}/${CI_JOB_ID}/pre-nyx-config.sh"

setup:pre-tyche:
  extends: .setup_base
  needs:
    - pipeline: "${PARENT_PIPELINE_ID}"
      job: build:nccl-arm-cu13
      artifacts: true
    - job: build:arm-cu13
      artifacts: true
  tags:
    - ptyche
  variables:
    NCCL_EP_MERGE_TARGET: "${PRE_TYCHE_INSTALL_DIR}/${CI_JOB_ID}/build"
    NCCL_BASE_ARTIFACT_DIR: "${CI_PROJECT_DIR}/.ci/nccl-arm-cu13/build"
    CI_BUILDS_DIR: "${PRE_TYCHE_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NCCL_CLUSTER_CONFIG_SOURCE: "${CI_PROJECT_DIR}/.gitlab/ci/clusters/pre-tyche-config.sh"
    NCCL_CLUSTER_CONFIG_TARGET: "${PRE_TYCHE_INSTALL_DIR}/${CI_JOB_ID}/pre-tyche-config.sh"


##
## Stage: unit_test
##

.nvsubmit_test:
  timeout: 2h
  before_script:
    - test -x "${NVSUBMIT_VENV:?setup did not publish a venv}/bin/nvsubmit"
    - mkdir -p "${NVSUBMIT_LOG_DIR}"
  script:
    - >-
      "${NVSUBMIT_VENV}/bin/nvsubmit" --verbose --testsuite "${NVSUBMIT_TESTSUITE}"
      --cluster-config "${NVSUBMIT_CLUSTER_CONFIG}" --nccl-home "${NCCL_HOME}"
      --log-dir "${NVSUBMIT_LOG_DIR}"
      --junit-xml junit_results.xml
  artifacts:
    when: always
    paths:
      - junit_results.xml
    reports:
      junit: junit_results.xml
    expire_in: 48 hours

unit:eos:
  extends: .nvsubmit_test
  stage: unit_test
  tags:
    - nccl-eos
  needs:
    - job: setup:eos
      artifacts: true
  variables:
    CI_BUILDS_DIR: "${EOS_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NVSUBMIT_CLUSTER_CONFIG: "nccl_ep/ci/systems/eos.yml"
    NVSUBMIT_LOG_DIR: "${EOS_NVSUBMIT_LOG_DIR}"
    NVSUBMIT_TESTSUITE: "nccl_ep/ci/tests/unit.yml"

unit:pre-tyche:
  extends: .nvsubmit_test
  stage: unit_test
  tags:
    - ptyche
  needs:
    - job: setup:pre-tyche
      artifacts: true
  variables:
    CI_BUILDS_DIR: "${PRE_TYCHE_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NVSUBMIT_CLUSTER_CONFIG: "nccl_ep/ci/systems/pre-tyche.yml"
    NVSUBMIT_LOG_DIR: "${PRE_TYCHE_NVSUBMIT_LOG_DIR}"
    NVSUBMIT_TESTSUITE: "nccl_ep/ci/tests/unit.yml"


##
## Stage: integration_test
##

.nvsubmit_integration:
  extends: .nvsubmit_test
  stage: integration_test
  script:
    - >-
      "${NVSUBMIT_VENV}/bin/nvsubmit" --verbose --testsuite nccl_ep/ci/tests/integration.yml
      --cluster-config "${NVSUBMIT_CLUSTER_CONFIG}" --nccl-home "${NCCL_HOME}"
      --log-dir "${NVSUBMIT_LOG_DIR}"
      --perf-regression-config nccl_ep/ci/perf-regression.yml
      --perf-regression-pdf performance-regression.pdf
      --junit-xml junit_results.xml
  artifacts:
    when: always
    paths:
      - junit_results.xml
      - performance-regression.pdf
    reports:
      junit: junit_results.xml
    expire_in: 48 hours

integration:ipp6:
  extends: .nvsubmit_integration
  rules:
    - when: never
  needs:
    - job: setup:ipp6
      artifacts: true
  tags:
    - ipp6-nccl
  variables:
    NVSUBMIT_CLUSTER_CONFIG: "nccl_ep/ci/systems/ipp6.yml"
    NVSUBMIT_LOG_DIR: "${IPP6_NVSUBMIT_LOG_DIR}"

integration:eos:
  extends: .nvsubmit_integration
  tags:
    - nccl-eos
  needs:
    - job: setup:eos
      artifacts: true
    - unit:eos
  variables:
    CI_BUILDS_DIR: "${EOS_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NVSUBMIT_CLUSTER_CONFIG: "nccl_ep/ci/systems/eos.yml"
    NVSUBMIT_LOG_DIR: "${EOS_NVSUBMIT_LOG_DIR}"

integration:python-eos:
  extends: .nvsubmit_test
  stage: integration_test
  tags:
    - nccl-eos
  needs:
    - job: setup:eos
      artifacts: true
    - unit:eos
  variables:
    CI_BUILDS_DIR: "${EOS_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NVSUBMIT_CLUSTER_CONFIG: "nccl_ep/ci/systems/eos.yml"
    NVSUBMIT_LOG_DIR: "${EOS_NVSUBMIT_LOG_DIR}"
    NVSUBMIT_TESTSUITE: "nccl_ep/ci/tests/python.yml"
  before_script:
    - !reference [.nvsubmit_test, before_script]
    - |
      set -euxo pipefail
      export CUDA_HOME="${EOS_CUDA_HOME}"
      export MPI_HOME="${EOS_MPI_HOME}"
      export PATH="${MPI_HOME}/bin:${PATH}"
      export LD_LIBRARY_PATH="${CUDA_HOME}/lib:${CUDA_HOME}/lib64:${CUDA_HOME}/extras/CUPTI/lib64:${NCCL_HOME}/lib:${MPI_HOME}/lib:${LD_LIBRARY_PATH:-}"
      bash python/ci/prepare_ep_test_env.sh
      source "python/.ci-ep-python-${CI_JOB_ID}/test-env.sh"

integration:pre-nyx:
  extends: .nvsubmit_integration
  rules:
    - when: never
  tags:
    - prenyx
  needs:
    - job: setup:pre-nyx
      artifacts: true
  variables:
    CI_BUILDS_DIR: "${PRE_NYX_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NVSUBMIT_CLUSTER_CONFIG: "nccl_ep/ci/systems/pre-nyx.yml"
    NVSUBMIT_LOG_DIR: "${PRE_NYX_NVSUBMIT_LOG_DIR}"

integration:pre-tyche:
  extends: .nvsubmit_integration
  tags:
    - ptyche
  needs:
    - job: setup:pre-tyche
      artifacts: true
    - unit:pre-tyche
  variables:
    CI_BUILDS_DIR: "${PRE_TYCHE_CI_BUILDS_DIR}/${CI_JOB_SUBPATH}"
    NVSUBMIT_CLUSTER_CONFIG: "nccl_ep/ci/systems/pre-tyche.yml"
    NVSUBMIT_LOG_DIR: "${PRE_TYCHE_NVSUBMIT_LOG_DIR}"


##
## Stage: cleanup
##

.cleanup_install:
  stage: cleanup
  when: on_success
  variables:
    GIT_STRATEGY: none
  script:
    - |
      set -euxo pipefail
      : "${CI_PIPELINE_ID:?}"
      : "${CLEANUP_INSTALL_DIR:?}"
      # Only delete this pipeline's cluster install, including setup/build retries.
      case "${CLEANUP_INSTALL_DIR}" in
        /*/install/"${CI_PIPELINE_ID}"/eos|\
        /*/install/"${CI_PIPELINE_ID}"/pre-nyx|\
        /*/install/"${CI_PIPELINE_ID}"/pre-tyche|\
        /*/install/"${CI_PIPELINE_ID}") ;;
        *) echo "Refusing to delete unexpected install path: ${CLEANUP_INSTALL_DIR}" >&2; exit 1 ;;
      esac
      rm -rf -- "${CLEANUP_INSTALL_DIR}"

cleanup:eos:
  extends: .cleanup_install
  tags:
    - nccl-eos
  needs:
    - job: build:x86-cu12
      artifacts: false
    - job: setup:eos
      artifacts: false
    - job: unit:eos
      artifacts: false
    - job: integration:eos
      artifacts: false
    - job: integration:python-eos
      artifacts: false
  variables:
    CLEANUP_INSTALL_DIR: "${EOS_INSTALL_DIR}"

cleanup:pre-tyche:
  extends: .cleanup_install
  tags:
    - ptyche
  needs:
    - job: build:cft-cu134
      artifacts: false
    - job: build:arm-cu13
      artifacts: false
    - job: setup:pre-tyche
      artifacts: false
    - job: unit:pre-tyche
      artifacts: false
    - job: integration:pre-tyche
      artifacts: false
    - job: integration:cft-pre-tyche
      artifacts: false
  variables:
    CLEANUP_INSTALL_DIR: "${PRE_TYCHE_INSTALL_DIR}"

cleanup:pre-nyx:
  extends: .cleanup_install
  rules:
    - when: never
  tags:
    - prenyx
  needs:
    - job: build:x86-cu12
      artifacts: false
    - job: setup:pre-nyx
      artifacts: false
    - job: integration:pre-nyx
      artifacts: false
  variables:
    CLEANUP_INSTALL_DIR: "${PRE_NYX_INSTALL_DIR}"

cleanup:ipp6:
  extends: .cleanup_install
  rules:
    - when: never
  tags:
    - ipp6-nccl
  needs:
    - job: build:x86-cu12
      artifacts: false
    - job: setup:ipp6
      artifacts: false
    - job: integration:ipp6
      artifacts: false
  variables:
    CLEANUP_INSTALL_DIR: "${IPP6_INSTALL_DIR}"
